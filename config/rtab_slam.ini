[Core]
; RTAB-Map tuning for a dual-core laptop (i3-3110M, integrated GPU, 10 GB RAM).
; Every key below is a stock RTAB-Map parameter: see `rtabmap --params`.

; --- graph optimization backend ---
; 0=TORO 1=g2o 2=GTSAM 3=Ceres. This build ships TORO+g2o+GTSAM (no Ceres),
; and GTSAM is its compiled-in default. Set to 1 to compare against g2o.
Optimizer\Strategy = 2
Optimizer\Iterations = 20
; Gravity constraints from the D435i IMU (needs g2o or GTSAM). 0 disables them.
; The value is the tolerance in radians: the stock 0.3 allows 17 degrees, which
; let a 19 m walk tilt by 5 degrees. 0.05 (about 3 degrees) matches how well the
; D435i IMU agrees with the graph when the camera stands still.
Optimizer\GravitySigma = 0.05

; --- how often a map node is created (main CPU knob) ---
Rtabmap\DetectionRate = 1.0
; Keep the memory small enough to stay real-time; older nodes move to long-term
; memory and still come back through loop closure / retrieval.
Rtabmap\TimeThr = 700
Rtabmap\MemoryThr = 0
; Do not keep rehearsed/unlinked nodes in the database: while the camera stands
; still they add tens of MB per minute and nothing to the map.
Mem\NotLinkedNodesKept = false

; --- visual odometry (F2M, RTAB-Map's default) ---
Odom\Strategy = 0
; After N consecutive frames without odometry, RTAB-Map resumes from the last
; pose with a large covariance, which starts a new map segment. 1 would split
; the graph on a single blurred frame. Now that mapping no longer steals frames
; from odometry, N frames pass in about half the time they used to, so a short
; glance at a blank wall reaches the countdown: 5 rides those out.
Odom\ResetCountdown = 5
; Odometry accuracy is what the whole map rests on, so these sit between the
; stock values (1000 / 2000 / 20) and the CPU budget of this laptop.
; Matching is windowed (Vis\CorGuessWinSize), so a larger local map costs
; little; the feature count is the part that shows up in the frame time.
Vis\MaxFeatures = 600
OdomF2M\MaxSize = 2000
; Stock is 20, which is the better number in a textured scene. Indoors, against
; plain walls and doors, it throws away frames that odometry could still track:
; a run through a bedroom lost tracking nine times at 20 and kept going at 15.
Vis\MinInliers = 15
; How far a feature may travel between two frames before odometry stops looking
; for it. The D435i sees 69 degrees over 640 pixels, so the stock 40 px is 4.3
; degrees, or about 65 deg/s at 15 fps - slower than a hand turning a corner.
; 80 px doubles that budget; the cost is a wider search per feature.
Vis\CorGuessWinSize = 80

; --- loop closure detection (bag-of-words) ---
; Stock 500. This runs once per map node (1 Hz), not per frame, and the mapping
; step has room: 103 ms median against the 700 ms Rtabmap\TimeThr budget.
Kp\MaxFeatures = 500
Mem\ImagePreDecimation = 1
Mem\ImagePostDecimation = 1
RGBD\ProximityBySpace = true
RGBD\AngularUpdate = 0.05
RGBD\LinearUpdate = 0.05
; A loop closure is rejected when its optimization error, divided by the
; standard deviation of a graph link, is above this value. F2M odometry reports
; a very tight covariance (about 6 mm per link), so after a meter of real drift
; the default 3.0 rejects even perfect closures - 99 of 101 on a 17 m walk.
; 10 keeps the guard against grossly wrong closures and lets the good ones in.
RGBD\OptimizeMaxError = 10

; --- 2D occupancy grid (fed to the 2D map window) ---
; Automatically forced to false when the program runs with --no-map2d.
RGBD\CreateOccupancyGrid = true
Grid\Sensor = 1
Grid\CellSize = 0.05
; Depth noise grows with the square of the distance: about 2 cm at 1.5 m, 5.5 cm
; at 2.8 m, which is what makes walls look thick on the 2D map. Odometry still
; uses the full range (Vis\MaxDepth), only the grid is trimmed.
Grid\RangeMax = 2.5
Grid\DepthDecimation = 8
; Drop cells with fewer than Grid\NoiseFilteringMinNeighbors neighbors within
; this radius: single noisy points never become obstacles.
Grid\NoiseFilteringRadius = 0.07
; The global grid accumulates hit/miss probabilities per cell. Asking for more
; agreement than the stock 0.5 trims the noisy fringe around obstacles.
GridGlobal\OccupancyThr = 0.65
; The stock settings build a 3D grid for OctoMap and never mark free space, so
; projecting them into a 2D window paints everything black: walls, furniture and
; ceiling alike, with white only where the floor happened to be seen.
; false = a real 2D grid, which is also cheaper than the 3D one.
Grid\3D = false
; Fill the space between the camera and each obstacle as free. This is what
; turns the map from a cloud of obstacles into a floor plan.
Grid\RayTracing = true
; Ignore the ceiling: obstacles above this height (base frame, z up) are dropped.
Grid\MaxObstacleHeight = 2.0

; --- depth range trusted from the D435i ---
Vis\MaxDepth = 4.0
Kp\MaxDepth = 4.0
